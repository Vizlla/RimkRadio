# Opcional: "New > Blueprint" no Render lê este arquivo e cria o site sozinho.
services:
  - type: web
    runtime: static
    name: syncwave
    buildCommand: node build.js
    staticPublishPath: dist
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
